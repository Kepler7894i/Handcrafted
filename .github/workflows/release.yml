name: Release

# Every push to main publishes (or refreshes) a release for the Minecraft version in gradle.properties.
# Release tag == Minecraft version (e.g. "26.2"), so the latest release for any Minecraft version can always be
# found and downloaded later, even after main has moved on to a newer Minecraft version.
#   - If the project builds, the code-only jars are attached.
#   - If it does not build (e.g. mid-port to a new Minecraft version), the release still contains the
#     version-specific source snapshot so that state can be recovered.
# The artwork is all-rights-reserved and is never built into the jars; see README ("Licensing").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        run: |
          mc=$(grep -E '^minecraftVersion=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          ver=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (code only)
        id: build
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew build -PcodeOnly --no-daemon --console=plain

      - name: Collect files
        run: |
          mkdir -p out
          git archive --format=zip --prefix="handcrafted-${{ steps.v.outputs.mc }}-source/" \
            -o "out/handcrafted-${{ steps.v.outputs.mc }}-source.zip" HEAD
          cp tools/AssetInstaller.java install-windows.ps1 install-linux.sh install-macos.sh out/
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp fabric/build/libs/handcrafted-fabric-*.jar out/ || true
            cp neoforge/build/libs/handcrafted-neoforge-*.jar out/ || true
            rm -f out/*-sources.jar
          fi
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mc="${{ steps.v.outputs.mc }}"
          ver="${{ steps.v.outputs.ver }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            status="Built from commit ${GITHUB_SHA}."
          else
            status="The build failed for commit ${GITHUB_SHA}, so only the source snapshot and scripts are attached."
          fi
          cat > notes.md <<'NOTES'
          Handcrafted for **Minecraft @MC@**, recreated from [terrarium-earth/Handcrafted](https://github.com/terrarium-earth/Handcrafted) (no longer maintained).

          **Files**
          - `handcrafted-fabric-@MC@-@VER@.jar`: Fabric (needs Fabric API and ResourcefulLib 5.x)
          - `handcrafted-neoforge-@MC@-@VER@.jar`: NeoForge (needs ResourcefulLib 5.x)
          - `install-windows.ps1`, `install-linux.sh`, `install-macos.sh`: installers for Windows, Linux and macOS (also install ResourcefulLib; options in the README)
          - `AssetInstaller.java`: adds the artwork, used by the installers (see below)
          - `handcrafted-@MC@-source.zip`: the exact source for this Minecraft version

          **Artwork is not included.** The textures, models, sounds and language files are All Rights Reserved by the original authors, so these jars contain only code and data (see the README for details). To install, run once (Java 25+):

          Run `install-windows.ps1` (Windows), `./install-linux.sh` (Linux) or `./install-macos.sh` (macOS), from the folder containing the jar and `AssetInstaller.java`. It installs the mod **and its required dependency ResourcefulLib** (downloaded automatically) into your Minecraft `mods` folder, replacing older versions of both, and adds the artwork (add `--loader neoforge` / `-Loader neoforge` for NeoForge). From a repository checkout it compiles the mod first. The output can be pointed at a different folder with `-ModsDir "<folder>"` (install-windows.ps1) or `--mods-dir <folder>` (install-linux.sh, install-macos.sh).

          @STATUS@ This release is updated by every push to main while main targets Minecraft @MC@.
          NOTES
          sed -i -e 's/^          //' -e "s|@MC@|$mc|g" -e "s|@VER@|$ver|g" -e "s|@STATUS@|$status|g" notes.md
          # Replace the previous release/tag for this Minecraft version with the current state.
          gh release delete "$mc" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$mc" out/* --target "$GITHUB_SHA" --title "Handcrafted $mc" --notes-file notes.md
